spring:
  application:
    name: seal-hackathon
  main:
    allow-circular-references: false

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SEAL;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      # Required for computed columns + filtered indexes on judge_assignments (SQL Server)
      connection-init-sql: SET QUOTED_IDENTIFIER ON

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:604800000}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
    password-reset-token-expiration-minutes: 15
    issuer: ${APP_JWT_ISSUER:seal-hackathon}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:./uploads}
  protected-emails: ${APP_PROTECTED_EMAILS:sinhvienfpt1908@gmail.com}
  magic-link:
    expiration-minutes: 30
  otp:
    expiration-seconds: 180
    resend-cooldown-seconds: 300
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
  submission:
    pdf:
      max-size-bytes: ${APP_SUBMISSION_PDF_MAX_SIZE_BYTES:5242880}
  hackathon:
    judging:
      max-judges-per-team: 3
      judge-trim-threshold: 5
      deviation-threshold: 25
      percent-scale: 20
    team:
      invitation-expiry-days: 7
      max-skill-roles: 5
      min-track-max-teams: 16
      max-track-max-teams: 40
    auth:
      max-failed-attempts: 5
      lock-duration-minutes: 15
      fpt-student-id-pattern: "^SE[0-9]{6}$"
    feedback:
      max-rating: 5
    seal:
      max-tracks: ${APP_HACKATHON_SEAL_MAX_TRACKS:3}
      max-teams-per-track: ${APP_HACKATHON_SEAL_MAX_TEAMS_PER_TRACK:8}
      finalist-count: ${APP_HACKATHON_SEAL_FINALIST_COUNT:6}
      top-per-track: ${APP_HACKATHON_SEAL_TOP_PER_TRACK:2}
  progress:
    alert-lead-time-hours: 6
    stalled-hours: 24
    cooldown-hours: 12

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
