name: Backend CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: mvn verify (SQL Server Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Pull SQL Server image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Run unit and integration tests
        working-directory: backend
        # CI=true is set by GitHub Actions — DockerAvailabilityCondition fails the
        # build if Docker is missing instead of silently skipping integration tests.
        run: mvn -B verify
